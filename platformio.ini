

[platformio]
default_envs = bringup

[env]
[env:esp32-hw100]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_port = /dev/ttyUSB1
upload_speed = 921600
; monitor_speed = 115200
monitor_filters = time, colorize

lib_deps =
  okalachev/FlixPeriph     ; for IMU + SBUS if you want to use ready drivers

[env:bringup]
build_flags = -DSW_BRINGUP

[env:fw]
build_flags = 
  -DSW_FIRMWARE
  -D CORE_DEBUG_LEVEL=1
  
